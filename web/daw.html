<!doctype html>
<!--
  JR!TER DAW: a MIDI player and a very simple piano-roll editor.
  What it is: one page, plain ES modules, no build step, no dependencies.
  Files: /daw/midi.js (read/write .mid and the plain-text song format, no DOM),
         /daw/chords.js (chord symbols to notes), /daw/pattern.js (patterns and steps, no DOM),
         /daw/rackview.js (the channel rack),
         /daw/playlist.js (clips on the song timeline, no DOM), /daw/songview.js (the Song tab), /daw/script.js (the note script language),
         /daw/sampler.js (sounds from the library as instruments and audio clips, no DOM), /daw/library.js (asks the library what it has), /daw/samplerview.js (the Sampler tab),
         /daw/mixer.js (mixer model and maths, no DOM), /daw/mixgraph.js (the mixer as Web Audio), /daw/mixerview.js (the Mixer tab),
         /daw/synth.js (Web Audio instruments), /daw/gestures.js (touch), /daw/chordview.js and
         /daw/scriptview.js (the two editors), /daw/daw.js (the page), /daw/icons.js (the one icon set), /daw/daw.css (the one stylesheet).
  On a wide desktop window the page is a studio: toolbar on top, the Sampler (library) docked left, the Mixer docked at the bottom.
  For the song tab in the Svelte ui/: import midi.js and synth.js as they are, and load a
  song's MIDI with  /daw.html?src=URL  or parseMidi(arrayBuffer).
  Your song is yours: save it as .mid or as the .json text format (it explains itself).
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DAW · JR!TER</title>
<link rel="stylesheet" href="/fonts/fonts.css">
<script>
  /* Same light/dark choice as the rest of JR!TER (Settings, Appearance). */
  (function () {
    var want = "auto";
    try { want = localStorage.getItem("jriter.theme") || "auto"; } catch (e) {}
    var t = want === "auto" ? (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark") : want;
    document.documentElement.setAttribute("data-theme", t);
  })();
</script>
<link rel="stylesheet" href="/glass.css">
<link rel="stylesheet" href="/daw/daw.css">
</head>
<body>
<nav class="views" id="views" role="tablist" aria-label="DAW views"></nav>
<header class="bar" id="bar"></header>
<main class="daw-main" id="main" data-view="chords">
  <aside class="tracks" id="tracks" aria-label="Tracks"></aside>
  <section class="roll" id="rollbox">
    <canvas id="roll" tabindex="0" aria-label="Piano roll"></canvas>
  </section>
  <section class="rack" id="rackview" aria-label="Channel rack"></section>
  <section class="song" id="songview" aria-label="Song playlist"></section>
  <section class="chords" id="chordview" aria-label="Chord editor"></section>
  <section class="scripts" id="scriptview" aria-label="Note scripts"></section>
</main>
<section class="mixer" id="mixerview" aria-label="Mixer"></section>
<section class="sampler" id="samplerview" aria-label="Sampler"></section>
<section class="help" id="helpbox" role="dialog" aria-label="How the DAW works" hidden></section>
<div class="toasts" id="toasts" role="status" aria-live="polite"></div>
<input type="file" id="file" accept=".mid,.midi,.json,audio/midi" hidden>
<script type="module" src="/daw/daw.js"></script>
<script type="module" src="/daw/ui.js"></script>
</body>
</html>
