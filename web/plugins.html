<!doctype html>
<!--
  JR!TER plugins page: which plugins a song's FL renders used.
  What it is: one page, plain ES modules, no build step, no dependencies.
  Files: /plugins/list.js (pure helpers), /plugins/plugins.js (the page), /plugins/plugins.css.
  Use: /plugins.html?song=ID[&version=VID]. Each version from an FL render carries a plugin list
  (sent by jriter-cli render, see docs/VST.md). "missing here" marks plugins not installed on the
  PC that rendered it. The song's Plugins tab (ui/src/views/song/PluginsTab.svelte) shows the same list; this page stays for direct links.
-->
