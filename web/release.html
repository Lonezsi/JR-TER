<!doctype html>
<!--
  JR!TER release page: turn an album into a release card for RouteNote.
  What it is: one page, plain ES modules, no build step, no dependencies.
  Files: /release/card.js (the card and its checks, no DOM; holds the agent's instructions),
         /release/release.js (the page), /release/release.css.
  Use: /release.html?album=ID. Fill in the details, then Download (card + cover + mixes into
  your Downloads folder) or Hand to Wh;le (the same, then opens jriter://release/ID, which the
  JR!TER desktop app answers by starting Claude Code on the card, in your own browser, where you
  sign in yourself). It stops for your OK before the final submit. See docs/ROUTENOTE.md.
  Released box: after the store accepts it, the date, store link and UPC are saved on the album.
  It becomes a button on the album page once the Svelte ui/ source is committed.
-->

<head>
